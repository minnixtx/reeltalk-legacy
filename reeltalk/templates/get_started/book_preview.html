{% load i18n %}
<div class="column is-cover">
    {% include 'snippets/book_cover.html' with book=book cover_class='is-h-l is-h-m-mobile' size_mobile='medium' size='large' %}

    <div class="select is-small mt-1 mb-3">
        <select name="{{ book.id }}" aria-label="{% blocktrans with book_title=book.title %}Have you watched {{ book_title }}?{% endblocktrans %}">
            <option disabled selected value>{% trans 'Add to your films' %}</option>
            {% for shelf in user_shelves %}
            {% if shelf.identifier == 'to-read' or shelf.identifier == 'read' %}
            <option value="{{ shelf.id }}">
                {% if shelf.identifier == 'to-read' %}{% trans "Want to Watch" %}
                {% elif shelf.identifier == 'read' %}{% trans "Watched" %}
                {% endif %}
            </option>
            {% endif %}
            {% endfor %}
        </select>
    </div>
</div>
