name: dev-wyrm
services:
  nginx:
    env_file: .env.dev
  web:
    env_file: .env.dev
    volumes:
      # :z = SELinux shared label (no-op on non-SELinux hosts)
      - .:/app:z
  db-backup-job: !reset null
  celery_worker:
    env_file: .env.dev
    volumes:
      - .:/app:z
  celery_beat:
    env_file: .env.dev
    volumes:
      - .:/app:z
  dev-tools:
    build: dev-tools
    env_file:
      - .env
      - .env.dev
    networks:
      - main
    volumes:
      - /app/dev-tools/
      - .:/app:z
    profiles:
      - tools
